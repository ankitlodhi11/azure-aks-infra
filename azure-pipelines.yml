trigger:
- main 
pool: 
 name: dhurander
stages:
  - stage:
    displayName: terraform&init 
    jobs:
      - job: 
        displayName: terraform init
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: '1.13.4'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'anuj-infra'
            backendAzureRmResourceGroupName: 'anuj-rg-bc'
            backendAzureRmStorageAccountName: 'anujstatefile123'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'anuj.terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'anuj-infra'
            backendAzureRmResourceGroupName: 'anuj-rg-bc'
            backendAzureRmStorageAccountName: 'anujstatefile123'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'anuj.terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            environmentServiceNameAzureRM: 'anuj-infra'
  - stage: 
    displayName: manual&validation
    jobs:
      - job: 
        displayName: approval
        pool: server
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'ankitlodhi11@gmail.com'
  - stage:
    displayName: apply
    jobs:
      - job: 
        displayName: apply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'anuj-infra'
            backendAzureRmStorageAccountName: 'anujstatefile123'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'anuj.terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            environmentServiceNameAzureRM: 'anuj-infra'
