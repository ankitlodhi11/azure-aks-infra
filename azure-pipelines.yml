trigger:
- main 
pool: 
 name: dhurander
stages:
  - stage:
    displayName: terraforminit 
    jobs:
      - job: 
        displayName: terraform init
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: '1.13.4'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'anuj-infra'
            backendAzureRmResourceGroupName: 'anuj-rg-bc'
            backendAzureRmStorageAccountName: 'anujstatefile123'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'anuj.terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'anuj-infra'
            backendAzureRmResourceGroupName: 'anuj-rg-bc'
            backendAzureRmStorageAccountName: 'anujstatefile123'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'anuj.terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            environmentServiceNameAzureRM: 'anuj-infra'
